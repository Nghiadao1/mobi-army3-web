<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MobiArmy 2 — client LibGDX gốc chạy trên trình duyệt." />
    <title>MobiArmy 2 — Original Web Client</title>
    <link rel="icon" type="image/png" href="./assets/res/icon.png" />
    <style>
      html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
      body { display:grid; place-items:center; }
      canvas { display:block; width:min(100vw,177.778vh); height:auto; max-height:100vh; touch-action:none; image-rendering:pixelated; }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" aria-label="MobiArmy 2"></canvas>
    <script>
      const config = new URLSearchParams(location.search);
      window.ARMY2_RELAY_URL = config.get('relay') || undefined;
      window.ARMY2_SERVER_LIST = config.get('servers') || undefined;
      window.addEventListener('load', () => main());
    </script>
    <script src="./app.js"></script>
  </body>
</html>
